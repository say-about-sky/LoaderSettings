plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.saysky'
version = '1.4.4'

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    // libs 目录:
    //   loader-1.6.0.jar        —— 框架运行时(FinalityLogger、luminosity2 注解、CallbackInfo)
    //   game.jar                —— 游戏本体类(Mixin 目标与游戏 API)
    //   finality-api-0.1.0.jar  —— 备用(本插件不直接引用)
    // 使用 shadow 配置,避免 shadowJar 将这三个 jar 打包进插件产物。
    shadow fileTree(dir: 'libs', includes: ['*.jar'])
}

java {
    // 目标运行环境为安卓(含游戏自带 JRE/安卓运行时),统一编译为 Java 8 字节码
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar { enabled = false }
shadowJar { archiveClassifier.set("") }
